<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="32" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">MatchEngine — Architecture</text>

  <!-- Producer thread(s) -->
  <rect x="30" y="80" width="180" height="90" rx="6" fill="#151b23" stroke="#3fb950" stroke-width="1.5"/>
  <text x="120" y="112" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">Producer thread(s)</text>
  <text x="120" y="132" fill="#7d8590" font-size="11" text-anchor="middle">engine.submit(order)</text>
  <text x="120" y="148" fill="#7d8590" font-size="11" text-anchor="middle">engine.cancel(id)</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="125" x2="290" y2="125" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="115" fill="#58a6ff" font-size="10" text-anchor="middle">push</text>

  <!-- SPSC Queue -->
  <rect x="300" y="70" width="220" height="110" rx="6" fill="#151b23" stroke="#d29922" stroke-width="1.5"/>
  <text x="410" y="95" fill="#d29922" font-size="13" font-weight="bold" text-anchor="middle">SpscQueue&lt;EngineRequest&gt;</text>
  <text x="410" y="118" fill="#7d8590" font-size="11" text-anchor="middle">lock-free ring buffer</text>
  <text x="410" y="134" fill="#7d8590" font-size="11" text-anchor="middle">atomics, acquire/release</text>
  <text x="410" y="150" fill="#7d8590" font-size="11" text-anchor="middle">no locks, no blocking</text>
  <text x="410" y="166" fill="#7d8590" font-size="10" text-anchor="middle">try_push() / try_pop()</text>

  <!-- Arrow 2 -->
  <line x1="520" y1="125" x2="600" y2="125" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="115" fill="#58a6ff" font-size="10" text-anchor="middle">pop</text>

  <!-- Engine thread -->
  <rect x="610" y="60" width="260" height="130" rx="6" fill="#151b23" stroke="#a855f7" stroke-width="1.5"/>
  <text x="740" y="85" fill="#a855f7" font-size="13" font-weight="bold" text-anchor="middle">MatchingEngine thread</text>
  <text x="740" y="108" fill="#7d8590" font-size="11" text-anchor="middle">single dedicated thread</text>
  <text x="740" y="124" fill="#7d8590" font-size="11" text-anchor="middle">drains queue in a loop</text>
  <text x="740" y="140" fill="#7d8590" font-size="11" text-anchor="middle">records match latency</text>
  <text x="740" y="156" fill="#7d8590" font-size="11" text-anchor="middle">(std::chrono per request)</text>
  <text x="740" y="175" fill="#e6edf3" font-size="10" text-anchor="middle">only thread that touches the book</text>

  <!-- Arrow down to OrderBook -->
  <line x1="740" y1="190" x2="740" y2="240" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="218" fill="#58a6ff" font-size="10" text-anchor="middle">calls</text>

  <!-- OrderBook -->
  <rect x="600" y="250" width="280" height="130" rx="6" fill="#151b23" stroke="#f85149" stroke-width="1.5"/>
  <text x="740" y="275" fill="#f85149" font-size="13" font-weight="bold" text-anchor="middle">OrderBook (no locks needed)</text>
  <text x="740" y="298" fill="#7d8590" font-size="11" text-anchor="middle">bids_: map&lt;price, list&lt;Order&gt;, greater&lt;&gt;&gt;</text>
  <text x="740" y="314" fill="#7d8590" font-size="11" text-anchor="middle">asks_: map&lt;price, list&lt;Order&gt;&gt;</text>
  <text x="740" y="330" fill="#7d8590" font-size="11" text-anchor="middle">index_: unordered_map&lt;id, Location&gt;</text>
  <text x="740" y="350" fill="#e6edf3" font-size="10" text-anchor="middle">price-time priority matching</text>
  <text x="740" y="365" fill="#e6edf3" font-size="10" text-anchor="middle">O(log P) cancel</text>

  <!-- Trade callback branch -->
  <line x1="600" y1="290" x2="330" y2="290" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="280" fill="#3fb950" font-size="10" text-anchor="middle">on_trade(Trade)</text>

  <rect x="80" y="250" width="250" height="80" rx="6" fill="#151b23" stroke="#3fb950" stroke-width="1.5"/>
  <text x="205" y="278" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">Trade callback</text>
  <text x="205" y="300" fill="#7d8590" font-size="11" text-anchor="middle">user-supplied function</text>
  <text x="205" y="316" fill="#7d8590" font-size="11" text-anchor="middle">e.g. print, log, publish</text>

  <!-- Footer note -->
  <text x="450" y="405" fill="#7d8590" font-size="11" text-anchor="middle">Producers never touch OrderBook directly — the queue is the only synchronization boundary.</text>
</svg>
